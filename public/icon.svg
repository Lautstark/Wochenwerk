<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- The family's speech bubble, in Wochenwerk's own accent. The shape is shared
       across the products and the colour is what tells them apart: mitreden pink,
       bildhaft orange, this one the blue that @lautstark/design/tokens holds for
       it. Same path, same eyes, same smile — copied rather than imported, because
       an icon is four numbers and a fill, and the tokens file is where the fact
       that would drift already lives. -->
  <path
    d="M 128 76 H 384 Q 436 76 436 128 V 272 Q 436 324 384 324 H 314 L 256 408 L 198 324 H 128 Q 76 324 76 272 V 128 Q 76 76 128 76 Z"
    fill="#3B6FF5"
  />

  <!-- Left eye -->
  <circle cx="200" cy="178" r="22" fill="white" />

  <!-- Right eye -->
  <circle cx="312" cy="178" r="22" fill="white" />

  <!-- Smile -->
  <path
    d="M 190 226 C 190 288 322 288 322 226"
    fill="none"
    stroke="white"
    stroke-width="26"
    stroke-linecap="round"
  />
</svg>
