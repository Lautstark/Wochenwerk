# Recording the visual baselines on the machine that will compare them.
#
# The screenshots in e2e/visual.spec.ts-snapshots are a picture of what the
# settings dialog looks like, and their whole purpose is to fail when it changes
# by accident. That only works where the comparison actually happens — and pixels
# belong to the machine that drew them. A baseline recorded on a laptop is a
# baseline the Linux runner has never seen, so it writes its own and passes,
# which is worse than no check at all: a green tick for a comparison that did not
# take place.
#
# The obvious fix is to record in the matching `mcr.microsoft.com/playwright`
# image locally. That does not work on an Apple Silicon machine: the runner is
# amd64, and amd64 under QEMU segfaults during `npm ci`. An arm64 image would run
# natively and produce baselines nobody could prove match the runner.
#
# So the recording happens here. Run this by hand, download the artifact and
# commit the PNGs beside the darwin ones — that is the whole of it. The spec asks
# the snapshot directory whether a baseline exists for the platform it is running
# on, so committing the files is what turns the comparison on. Nothing else to
# flip, and nothing to remember to flip back.
name: Record visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Whether the install matches the pins
        # A baseline is committed, and a wrong one is committed forever: every
        # later run then compares against the wrong picture and passes. The
        # panels in these shots are drawn by the shared packages, so a stale
        # install records that version's stylesheet as the truth.
        run: npm run preflight

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Record
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Hand them back
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
