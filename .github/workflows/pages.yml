name: Deploy to GitHub Pages

# The shape is bildhaft's deploy.yml by way of vorlaut-editor's: check, then
# build, then deploy, with pull requests checked and never published. Wochenwerk
# has no Playwright and no Python, so the check job is the three commands the
# repository already runs by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more. Cancelling half way
# leaves Pages serving whatever it had got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      # `npm test` is tools/no-private.mjs and then vitest. The first is why a
      # household's own week cannot reach a public site through a fixture; it
      # passes with a note where .private-names is absent, which is the case
      # here and is the point — see its header.
      - name: Nobody real, and the tests
        run: npm test

  build:
    needs: check
    # Pull requests are checked but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A domain of its own, or a path under the organisation's.
      #
      # Wochenwerk was served from lautstark.tech/Wochenwerk/, which is the same
      # *origin* as the overview site: one storage quota between a calendar and a
      # marketing page, and "clear site data" on either taking both. Its own
      # subdomain fixes that and matches the other three products.
      #
      # The switch is a repository variable rather than an edit, because the DNS
      # record has to exist first and nothing here can know when it does. Set
      # `PAGES_DOMAIN` to wochenwerk.lautstark.tech and re-run: the build goes to
      # the root instead of a subpath and a CNAME travels with it, which is what
      # tells Pages the domain. Unset it and the old address comes back.
      - name: Build
        env:
          # Derived from the repository name where there is no domain, so it
          # follows a rename for free.
          BASE_PATH: ${{ vars.PAGES_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      - name: The domain, where there is one
        if: vars.PAGES_DOMAIN != ''
        run: echo "${{ vars.PAGES_DOMAIN }}" > dist/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
