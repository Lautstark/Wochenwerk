name: Deploy to GitHub Pages

# The shape is bildhaft's deploy.yml by way of vorlaut-editor's: check, then
# build, then deploy, with pull requests checked and never published. Wochenwerk
# has no Python, so the check job is the two commands the repository already
# runs by hand — and, since 2026-09-03, an e2e job beside it, which is the last
# thing this repository was missing that its three siblings had.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more. Cancelling half way
# leaves Pages serving whatever it had got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        #
        # wochenwerk was the one product not running this, and the one product
        # that had gone stale - design v1.26.1 against v1.27.0 everywhere else,
        # bildquelle v2.0.0 against v2.1.0. Nothing looked wrong, because that
        # release moved no shared CSS. The next one will, and then the drift is
        # a product quietly drawn from an older stylesheet than its siblings.
        run: node node_modules/@lautstark/design/pins.js
      - name: Types
        run: npm run typecheck
      # `npm test` is tools/no-private.mjs and then vitest. The first is why a
      # household's own week cannot reach a public site through a fixture; it
      # passes with a note where .private-names is absent, which is the case
      # here and is the point — see its header.
      - name: Nobody real, and the tests
        run: npm test

  e2e:
    # The browser tests, laid out the way bildhaft and mitreden lay theirs out:
    # cache the browser, install chromium alone, run the suite, keep the report
    # only when something went wrong.
    #
    # ## What this job does and does not prove
    #
    # The suite is visual — committed PNGs of the settings dialog and its
    # panels, so that CSS moving out of this product and into @lautstark/design
    # can be shown to change nothing. Pixels belong to the machine that drew
    # them: the baselines in the repository are a macOS Chromium's, and this
    # runner's Linux Chromium disagrees with them on every antialiased edge.
    # Playwright keeps the two apart by platform in the file name, so without
    # anything further this runner would find no baseline of its own, write one,
    # and pass — a green tick for a comparison that never happened.
    #
    # So playwright.config.ts sets `ignoreSnapshots` under CI and this job runs
    # the rest of the spec: the calendar loads, the dialog opens, all nine
    # headings say what they should, and each of the three panels unfolds with
    # its contents in it. That is a real smoke test of the route the deploy is
    # about to publish. The pixel comparison stays local, beside the person
    # moving the CSS, which is where the question gets asked.
    #
    # To bring the pixels here too, record a Linux baseline in the matching
    # `mcr.microsoft.com/playwright` image, commit it beside the darwin ones and
    # drop `ignoreSnapshots`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The config's webServer starts `vite` itself, so there is nothing to
      # start here. It is the dev server rather than a preview of a bundle,
      # deliberately — see the note at the top of playwright.config.ts. The
      # build is still gated: the `build` job below needs this one.
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: [check, e2e]
    # Pull requests are checked but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A domain of its own, or a path under the organisation's.
      #
      # Wochenwerk was served from lautstark.tech/Wochenwerk/, which is the same
      # *origin* as the overview site: one storage quota between a calendar and a
      # marketing page, and "clear site data" on either taking both. Its own
      # subdomain fixes that and matches the other three products.
      #
      # The switch is a repository variable rather than an edit, because the DNS
      # record has to exist first and nothing here can know when it does. Set
      # `PAGES_DOMAIN` to wochenwerk.lautstark.tech and re-run: the build goes to
      # the root instead of a subpath and a CNAME travels with it, which is what
      # tells Pages the domain. Unset it and the old address comes back.
      - name: Build
        env:
          # Derived from the repository name where there is no domain, so it
          # follows a rename for free.
          BASE_PATH: ${{ vars.PAGES_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      - name: The domain, where there is one
        if: vars.PAGES_DOMAIN != ''
        run: echo "${{ vars.PAGES_DOMAIN }}" > dist/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
